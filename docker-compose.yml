# =============================================================================
# OpenNote — local dev compose (ticket 0009).
# Postgres + MinIO. The apps run via `pnpm dev` (Turborepo) on the host.
# This same compose is the basis for the self-host prod compose (extended with
# a Caddy/Nginx reverse proxy + TLS in compose.prod.yml — a build detail).
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opennote
      POSTGRES_PASSWORD: opennote
      POSTGRES_DB: opennote
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennote -d opennote"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket creator: creates the `opennote` bucket in MinIO on first boot.
  # Bucket stays private — attachments are served only via app-minted presigned
  # URLs after can_read (ticket 0007). Do NOT set anonymous download.
  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/opennote
      "

  # Dev reverse proxy — mirrors prod topology (web + realtime behind one origin
  # on :3000) so the session cookie flows on the WS upgrade and the realtime
  # origin check (🔒 0010 #4) passes. The web app + realtime server run on the
  # host via `pnpm dev` (web on :3001, realtime on :4321); Caddy reaches them
  # via host.docker.internal. See Caddyfile.dev.
  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
