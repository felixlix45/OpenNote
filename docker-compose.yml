# =============================================================================
# OpenNote — local dev compose (ticket 0009).
# Postgres + MinIO. The apps run via `pnpm dev` (Turborepo) on the host.
# This same compose is the basis for the self-host prod compose (extended with
# a Caddy/Nginx reverse proxy + TLS in compose.prod.yml — a build detail).
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opennote
      POSTGRES_PASSWORD: opennote
      POSTGRES_DB: opennote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennote -d opennote"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket creator: creates the `opennote` bucket in MinIO on first boot.
  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/opennote &&
      mc anonymous set download local/opennote || true
      "

volumes:
  postgres_data:
  minio_data:
